services:
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - AGENTS_TEMPLATE_ENVIRONMENT=development
    volumes:
      - .:/api/agents_template
      - /api/agents_template/.venv
    networks:
      - agents-template-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: [ "uvicorn", "app.main:app", "--reload", "--proxy-headers", "--host", "0.0.0.0", "--port", "8000" ]


networks:
  agents-template-network:
    driver: bridge
