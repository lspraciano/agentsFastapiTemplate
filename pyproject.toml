[project]
name = "agentsfastapitemplate"
version = "0.1.0"
description = "Agent-centric FastAPI template with LangGraph"
readme = "docs/README.md"
requires-python = ">=3.13"
dependencies = [
    "dynaconf>=3.3.2",
    "fastapi>=0.139.0",
    "langchain>=1.3.12",
    "langchain-core>=1.4.9",
    "langchain-openai>=1.3.4",
    "langfuse>=4.13.2",
    "langgraph>=1.2.8",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "pydantic>=2.13.4",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.20",
]
